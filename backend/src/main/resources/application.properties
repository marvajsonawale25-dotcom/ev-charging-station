spring.application.name=ev-charging-backend

# Server Configuration (Supports cloud PORT injected by Render/Railway/Heroku)
server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL Database Configuration
# Local default: jdbc:postgresql://localhost:5432/ev_charging_db
# Cloud configuration via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ev_charging_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Marvaj}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# JWT Security Configuration
# Override in production via JWT_SECRET and JWT_EXPIRATION_MS
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
# Override in production with FRONTEND_URL or CORS_ALLOWED_ORIGINS (e.g. https://your-project.vercel.app)
app.cors.allowed-origins=${FRONTEND_URL:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}}

# Logging
logging.level.com.evcharging=INFO
logging.level.org.springframework.security=WARN
