spring.application.name=ev-charging-backend

# Server Configuration (Uses Render's PORT environment variable, with 8080 as local fallback)
server.port=${PORT:8080}

# PostgreSQL Database Configuration
# Supports DB_URL, DATABASE_URL, or constructs jdbc:postgresql://DB_HOST:DB_PORT/DB_NAME from Render
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ev_charging_db}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Explicitly configure PostgreSQL Dialect for Hibernate 6 to avoid dialect resolution failures
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# JWT Security Configuration (Configured via JWT_SECRET environment variable)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Configured via FRONTEND_URL environment variable)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.evcharging=INFO
logging.level.org.springframework.security=WARN
