# Render Blueprint Specification for EV Charging Station
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: ev-charging-db
    databaseName: ev_charging_db
    user: ev_user
    plan: free

services:
  # ==========================================
  # Spring Boot Backend Web Service
  # ==========================================
  - type: web
    name: ev-charging-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/ev-charging-backend-1.0.0.jar
    plan: free
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: ev-charging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # ==========================================
  # React + Vite Frontend Static Site
  # ==========================================
  - type: web
    name: ev-charging-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
