# Render Blueprint Specification for EV Charging Station
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: ev-charging-db
    databaseName: ev_charging_db
    user: ev_user
    plan: free

services:
  # ==========================================
  # Spring Boot Backend (Docker Runtime for Java 17)
  # ==========================================
  - type: web
    name: ev-charging-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ev-charging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ev-charging-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ev-charging-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ev-charging-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ev-charging-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: ev-charging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # ==========================================
  # React + Vite Frontend Static Site
  # ==========================================
  - type: web
    name: ev-charging-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
